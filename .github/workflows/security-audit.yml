name: Security Audit & SAST

on:
  schedule:
    # Pravidelný bezpečnostní audit každé pondělí ve 4:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  security-events: write

jobs:
  package-audit:
    name: Package Vulnerability Audit (Composer & NPM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl

      - name: Composer Security Audit
        run: |
          echo "🔍 Kontrola zranitelností v PHP balíčcích (Composer Audit)..."
          composer audit --format=table || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Security Audit
        run: |
          echo "🔍 Kontrola zranitelností v Node.js/NPM balíčcích (NPM Audit)..."
          npm audit --audit-level=high || true

  sast-code-scan:
    name: Static Application Security Testing (Semgrep SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/php
            p/javascript
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/owasp-top-ten

  secrets-leak-detection:
    name: Secret & Credential Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Notify Discord Security Channel
    runs-on: ubuntu-latest
    needs: [package-audit, sast-code-scan, secrets-leak-detection]
    if: always()

    steps:
      - name: Send Discord Security Report
        env:
          DISCORD_SECURITY_WEBHOOK_URL: ${{ secrets.DISCORD_SECURITY_WEBHOOK_URL }}
          PKG_RESULT: ${{ needs.package-audit.result }}
          SAST_RESULT: ${{ needs.sast-code-scan.result }}
          SECRETS_RESULT: ${{ needs.secrets-leak-detection.result }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DISCORD_SECURITY_WEBHOOK_URL" ]; then
            echo "DISCORD_SECURITY_WEBHOOK_URL není nastavena v GitHub Secrets, přeskakuji odeslání."
            exit 0
          fi

          ALL_PASSED=true
          if [ "$PKG_RESULT" != "success" ] || [ "$SAST_RESULT" != "success" ] || [ "$SECRETS_RESULT" != "success" ]; then
            ALL_PASSED=false
          fi

          if [ "$ALL_PASSED" = "true" ]; then
            COLOR=1096065
            TITLE="🛡️ Bezpečnostní audit: Všechny kontroly v pořádku"
            STATUS_DESC="Týdenní bezpečnostní audit neshledal žádné kritické zranitelnosti ani úniky hesel."
          else
            COLOR=15680580
            TITLE="⚠️ Bezpečnostní audit: Nalezeny incidenty nebo zranitelnosti"
            STATUS_DESC="Jedna nebo více bezpečnostních kontrol selhaly nebo nalezly bezpečnostní problém."
          fi

          JSON_PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "$TITLE",
                "description": "$STATUS_DESC",
                "color": $COLOR,
                "fields": [
                  {
                    "name": "📦 Balíčky (Composer & NPM)",
                    "value": "$PKG_RESULT",
                    "inline": true
                  },
                  {
                    "name": "🔍 SAST Kód (Semgrep OWASP)",
                    "value": "$SAST_RESULT",
                    "inline": true
                  },
                  {
                    "name": "🔑 Úniky hesel (Gitleaks)",
                    "value": "$SECRETS_RESULT",
                    "inline": true
                  },
                  {
                    "name": "Větev",
                    "value": "\`$BRANCH\`",
                    "inline": true
                  },
                  {
                    "name": "Spustil",
                    "value": "$ACTOR",
                    "inline": true
                  },
                  {
                    "name": "Detail běhu & Logy",
                    "value": "[Zobrazit GitHub Run]($RUN_URL)",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "BrnoAkce DevSecOps Security Pipeline"
                },
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          curl -s -H "Content-Type: application/json" -X POST -d "$JSON_PAYLOAD" "$DISCORD_SECURITY_WEBHOOK_URL"
